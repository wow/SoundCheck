version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        versions: [">=7.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "chore(ci)" }
