version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "chore(ci)" }
