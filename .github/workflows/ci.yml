name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: generated IPC bindings are committed
        run: git diff --exit-code -- src/lib/ipc/generated

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    name: typecheck, lint, vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --run

  version-sync:
    name: one version everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          cargo_v=$(perl -0777 -ne 'print $1 if /\[workspace\.package\][^\[]*?\nversion\s*=\s*"([^"]+)"/' Cargo.toml)
          pkg_v=$(node -p "require('./package.json').version")
          echo "Cargo.toml $cargo_v / package.json $pkg_v"
          test "$cargo_v" = "$pkg_v"
          ! grep -q '"version"' src-tauri/tauri.conf.json

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: |
          # The PR's own commits only: GitHub's synthetic merge commit carries no sign-off.
          missing=0
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by (use git commit -s)"; missing=1
            fi
          done
          exit $missing

  pr-title:
    name: conventional PR title
    # Dependabot's titles start with a capital "Bump"; its PRs are squash-merged with a rewritten title.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: check
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          types='feat|fix|perf|refactor|test|docs|build|ci|chore|revert'
          scopes='core|io|dsp|analysis|engine|cli|desktop|ui|ipc|docs|ci|deps|release'
          echo "$TITLE" | grep -Eq "^($types)(\(($scopes)(,($scopes))*\))?!?: [^ A-Z].*[^.]$" || { echo "::error::PR title must be 'type(scope): imperative subject' (see CONTRIBUTING.md)"; exit 1; }
          test "${#TITLE}" -le 72 || { echo "::error::PR title is longer than 72 characters"; exit 1; }

  macos-build:
    name: macOS test + debug build
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Beat-tracking model files (pinned, cached)
        uses: actions/cache@v4
        with:
          path: models
          key: beat-this-models-089b5092
      - run: ./scripts/fetch-models.sh
      - run: cargo test --workspace --all-features
      - run: pnpm tauri build --debug --bundles app --config src-tauri/tauri.bundle.conf.json
      - name: The app bundle carries the beat-tracking model
        run: |
          app=$(find target/debug/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          ls -l "$app/Contents/Resources/models/mel_spectrogram.onnx" "$app/Contents/Resources/models/beat_this_small.onnx"

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v7
        with: { name: lcov, path: lcov.info }
