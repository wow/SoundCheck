name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: tag matches the workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      target: ${{ steps.v.outputs.target }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.inputs.tag || github.ref_name }}" }
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cargo_v=$(perl -0777 -ne 'print $1 if /\[workspace\.package\][^\[]*?\nversion\s*=\s*"([^"]+)"/' Cargo.toml)
          test "v$cargo_v" = "$tag" || { echo "::error::tag $tag but Cargo.toml version is $cargo_v"; exit 1; }
          pre=false; case "$tag" in *-*) pre=true;; esac
          # aarch64 while the app is 0.0.x or an alpha; universal from the first beta onward.
          target=universal-apple-darwin; case "$tag" in v0.0.*|*-alpha*) target=aarch64-apple-darwin;; esac
          echo "version=$cargo_v" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"; echo "target=$target" >> "$GITHUB_OUTPUT"

  build:
    name: build, sign, notarize, publish
    needs: check
    runs-on: macos-14
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.check.outputs.tag }}", fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin, x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: App Store Connect API key file
        if: ${{ env.APPLE_API_KEY_CONTENT != '' }}
        env: { APPLE_API_KEY_CONTENT: "${{ secrets.APPLE_API_KEY_CONTENT }}" }
        run: |
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with: { args: "--latest --strip header" }
      - uses: taiki-e/install-action@cargo-about
      - name: Third-party licences
        run: cargo about generate about.hbs -o THIRD_PARTY.md
      - name: Signing keychain
        # Import the Developer ID certificate into a job-wide keychain so that both tauri-action
        # and the later codesign of sc-cli can use it (tauri-action's own import lives only inside
        # its step). Deleted again in the last step.
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"
      - name: Build, sign, notarize and publish the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: "SoundCheck ${{ needs.check.outputs.tag }}"
          releaseBody: ${{ steps.notes.outputs.content }}
          prerelease: ${{ needs.check.outputs.prerelease }}
          # Create the release as a draft: the repository makes published releases immutable, so
          # every asset (app, notarized DMG, CLI tarball, checksums, licences) must be attached
          # before the final publish step below.
          releaseDraft: true
          args: --target ${{ needs.check.outputs.target }}
      - name: Notarize and staple the DMG
        # Tauri notarizes and staples the .app; the disk image around it must be notarized too,
        # otherwise Gatekeeper reports the downloaded DMG as "Unnotarized Developer ID".
        if: ${{ env.APPLE_API_KEY_PATH != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          for dmg in target/*/release/bundle/dmg/*.dmg; do
            [ -f "$dmg" ] || continue
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            gh release upload "${{ needs.check.outputs.tag }}" "$dmg" --clobber
          done
      - name: sc-cli tarball and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          target=${{ needs.check.outputs.target }}; v=${{ needs.check.outputs.version }}
          if [ "$target" = universal-apple-darwin ]; then
            cargo build --release -p sc-cli --target aarch64-apple-darwin
            cargo build --release -p sc-cli --target x86_64-apple-darwin
            lipo -create -output sc-cli target/aarch64-apple-darwin/release/sc-cli target/x86_64-apple-darwin/release/sc-cli
          else
            cargo build --release -p sc-cli --target "$target"; cp "target/$target/release/sc-cli" sc-cli
          fi
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then codesign --force --options runtime --timestamp -s "${{ secrets.APPLE_SIGNING_IDENTITY }}" sc-cli; fi
          # A bare binary cannot carry a stapled ticket, but Gatekeeper looks the ticket up online:
          # without this, a browser-downloaded sc-cli is killed on first run.
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            ditto -c -k sc-cli sc-cli.zip
            xcrun notarytool submit sc-cli.zip --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            rm -f sc-cli.zip
          fi
          tar -czf "sc-cli-$v-$target.tar.gz" sc-cli
          gh release view "${{ needs.check.outputs.tag }}" --json assets --jq '.assets[].name' | grep '\.app\.tar\.gz$' | while read -r a; do gh release delete-asset "${{ needs.check.outputs.tag }}" "$a" -y; done
          shasum -a 256 "sc-cli-$v-$target.tar.gz" > SHA256SUMS.txt
          for dmg in target/*/release/bundle/dmg/*.dmg; do
            [ -f "$dmg" ] && (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")") >> SHA256SUMS.txt
          done
          gh release upload "${{ needs.check.outputs.tag }}" "sc-cli-$v-$target.tar.gz" SHA256SUMS.txt THIRD_PARTY.md --clobber
      - name: Publish the release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release edit "${{ needs.check.outputs.tag }}" --draft=false
      - name: Remove the signing keychain
        if: ${{ always() && env.SIGNING_KEYCHAIN != '' }}
        run: security delete-keychain "$SIGNING_KEYCHAIN"
