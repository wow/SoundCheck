name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: EBU test set + long property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/fetch-ebu-testset.sh
      - run: SC_EBU_TESTSET=1 cargo test --workspace --all-features -- --include-ignored
      - run: PROPTEST_CASES=10000 cargo test --workspace --all-features
