# cargo-about: generates THIRD_PARTY.md for releases (`cargo about generate about.hbs -o THIRD_PARTY.md`).
# Lists the licences of every crate compiled into the shipped macOS binaries; build-time and
# dev-only crates and our own (unpublished) workspace crates are left out.
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MPL-2.0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD", "BSL-1.0",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
