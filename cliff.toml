# git-cliff configuration. Groups follow docs/RELEASING.md section 7.
[changelog]
# scripts/release.sh prepends one section per release with `git cliff --unreleased --tag vX --prepend`.
# git-cliff writes the header plus one newline, then the body verbatim, then the old file with the
# header stripped; header and body therefore both end with exactly one newline so that one blank
# line separates every section. The script trims the blank line this leaves at the end of the file.
header = """
# Changelog

All notable changes to SoundCheck are listed here, newest first. The format follows Keep a Changelog; versions follow SemVer as described in docs/RELEASING.md. Sections are generated from the commit history by git-cliff at release time.
"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% if commits | length == 0 %}
No user-facing changes (build, CI, docs or test work only).
{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} [**breaking**]{% endif %}
{% endfor %}{% endfor %}"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { footer = "^Output-Change:\\s*yes", group = "<!-- 2 -->Output changes" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix\\(security\\)", group = "<!-- 4 -->Security" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Changed" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(docs|test|ci|build|chore|style)", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
