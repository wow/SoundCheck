[package]
name = "sc-analysis"
description = "SoundCheck measurements: peaks, loudness (BS.1770), beats and grid fitting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sc-core = { workspace = true }
sc-dsp = { workspace = true }
beat-this = { workspace = true }
# Only to implement beat-this's `Model` trait, whose runs return `anyhow::Result`.
anyhow = { workspace = true }
tracing = { workspace = true }
ebur128 = { workspace = true }

[dev-dependencies]
sc-core = { workspace = true, features = ["testsig"] }
sc-io = { workspace = true }
approx = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "peak"
harness = false

[[bench]]
name = "loudness"
harness = false

[[bench]]
name = "grid"
harness = false
