[package]
name = "sc-io"
description = "SoundCheck file layer: decoding, byte-preserving writers, write transactions, cache and DJ-app artefacts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# examples/txn_apply.rs is a [[bin]] (below), so Cargo builds it before the crash matrix.
autoexamples = false

[lints]
workspace = true

[features]
default = []
# Test-only fault injection for the write transaction's crash matrix: the transaction aborts the
# process right after the step named by the environment variable SC_TEST_CRASH_AFTER_STEP.
# Never enable it in a shipped build.
crash-test = []

[dependencies]
sc-core = { workspace = true }
sc-dsp = { workspace = true }
symphonia = { workspace = true }
lofty = { workspace = true }
directories = { workspace = true }
blake3 = { workspace = true }
flac-codec = { workspace = true }
md-5 = { workspace = true }
unicode-normalization = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
xattr = { workspace = true }
rustix = { workspace = true }
jiff = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { workspace = true }

[dev-dependencies]
sc-core = { workspace = true, features = ["testsig"] }
approx = { workspace = true }
hound = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
proptest = { workspace = true }
libm = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "iff"
harness = false

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "id3"
harness = false

[[bench]]
name = "flac"
harness = false

# The crash matrix's subject (tests/crash.rs). A bin target rather than an example: Cargo builds
# bins before integration tests and passes their path in CARGO_BIN_EXE_<name>, so the test never
# runs a stale build. Only built with the test-only `crash-test` feature.
[[bin]]
name = "txn_apply"
path = "examples/txn_apply.rs"
required-features = ["crash-test"]
test = false
doc = false

[[test]]
name = "crash"
required-features = ["crash-test"]
