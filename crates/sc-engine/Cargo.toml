[package]
name = "sc-engine"
description = "The SoundCheck pipeline the app and the CLI share"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sc-core = { workspace = true }
sc-dsp = { workspace = true }
sc-io = { workspace = true }
sc-analysis = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
rtrb = { workspace = true }
cpal = { workspace = true, optional = true }
unicode-normalization = { workspace = true }

[features]
# The audio output device; only the desktop app enables it, so `sc-cli` never links CoreAudio.
playback = ["dep:cpal"]

[dev-dependencies]
sc-core = { workspace = true, features = ["testsig"] }
sc-analysis = { workspace = true }
hound = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "decide"
harness = false

[[bench]]
name = "track"
harness = false

[[bench]]
name = "fit_choice"
harness = false

[[example]]
name = "click"
required-features = ["playback"]
