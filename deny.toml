# cargo-deny: every dependency in the shipped binary must be permissively licensed.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" advisories (no vulnerability) on crates that Tauri pulls in; nothing in SoundCheck
# uses them directly. Revisit whenever Tauri is updated: `cargo deny check advisories`.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; proc-macro-time only, via tauri-macros" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range is unmaintained; via urlpattern <- tauri-utils" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common is unmaintained; via urlpattern <- tauri-utils" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property is unmaintained; via urlpattern <- tauri-utils" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version is unmaintained; via urlpattern <- tauri-utils" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident is unmaintained; via urlpattern <- tauri-utils" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without a version (they are never published).
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
