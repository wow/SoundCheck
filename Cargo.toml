[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wow/SoundCheck"
rust-version = "1.98"
authors = ["SoundCheck contributors"]
publish = false

[workspace.dependencies]
sc-core = { path = "crates/sc-core" }
sc-dsp = { path = "crates/sc-dsp" }
sc-io = { path = "crates/sc-io" }
sc-analysis = { path = "crates/sc-analysis" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "mp3", "aiff", "isomp4", "aac", "alac", "ogg", "vorbis", "opt-simd"] }
ts-rs = { version = "10", features = ["serde-compat"] }
ebur128 = "0.1"
lofty = "0.25"
directories = "6"
blake3 = "1"
unicode-normalization = "0.1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"

# test and bench only
approx = "0.5"
criterion = { version = "0.5", default-features = false }
proptest = "1"
hound = "3.5"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Dependencies (ebur128, symphonia, the model runtime) are optimised even in dev builds so tests
# on real-length audio stay fast; workspace crates keep full debug info.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
