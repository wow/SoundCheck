[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wow/SoundCheck"
rust-version = "1.98"
authors = ["SoundCheck contributors"]
publish = false

[workspace.dependencies]
sc-core = { path = "crates/sc-core" }
sc-dsp = { path = "crates/sc-dsp" }
sc-io = { path = "crates/sc-io" }
sc-analysis = { path = "crates/sc-analysis" }
sc-engine = { path = "crates/sc-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "mp3", "aiff", "isomp4", "aac", "alac", "ogg", "vorbis", "opt-simd"] }
ts-rs = { version = "12", features = ["serde-compat"] }
beat-this = "1"
rubato = "5"
ebur128 = "0.1"
lofty = "0.25"
directories = "6"
blake3 = "1"
# FLAC frames only (no rayon: single-threaded, deterministic); metadata blocks are our own.
flac-codec = { version = "1.3.3", default-features = false }
# STREAMINFO MD5 (RFC 9639) in the FLAC writer; also used by tests.
md-5 = "0.11"
# Pure-Rust maths (musl port): the same bits on every platform, unlike the system libm.
libm = { version = "0.2", default-features = false }
unicode-normalization = "0.1"
# Write transaction: extended attributes copied through the atomic rename, fsync fallback,
# free space and no-replace rename (rustix, fs only), ACL detection on macOS (exacl).
xattr = "1.6"
rustix = { version = "1.1", features = ["fs"] }
exacl = "0.13"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
cpal = "0.18"
rtrb = "0.4"

# test and bench only
approx = "0.5"
criterion = { version = "0.8", default-features = false }
proptest = "1"
hound = "3.5"
tempfile = "3"
sha2 = "0.11"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
# Every library crate also forbids unsafe code in its lib.rs; "deny" here lets a test that needs
# it (a counting global allocator) opt in with `#![allow(unsafe_code)]` and SAFETY comments.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Dependencies (ebur128, symphonia, the model runtime) are optimised even in dev builds so tests
# on real-length audio stay fast; workspace crates keep full debug info.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
